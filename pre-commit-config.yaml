# Pre-commit hooks for Ripples.
#
# These mirror the lint and type-check gates the CI runs, so the same
# failures are caught locally before a commit instead of after a red CI run.
#
# One-time setup in a checkout:
#     pip install -e .[dev]      # or just: pip install pre-commit
#     pre-commit install
#
# Run on demand against the whole tree:
#     pre-commit run --all-files
#
# Bump the pinned `rev`s to their latest releases with:
#     pre-commit autoupdate

repos:
  # Ruff: linter (with autofix) and formatter. Configuration is read from
  # the [tool.ruff] tables in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]

  # General.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

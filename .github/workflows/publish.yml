name: Publish to PyPI

# Runs when you publish a GitHub Release. Building and publishing are split
# into two jobs so the publishing job can hold the minimal permissions it
# needs (id-token: write) and nothing else — this is the pattern the PyPA
# pypi-publish action recommends.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The environment name here MUST match the one you set when you
    # configure the Trusted Publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/ripples-sci

    # OIDC token for trusted publishing. No API token / password needed.
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
